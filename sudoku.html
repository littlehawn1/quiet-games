// Box lines and Killer cage outlines, drawn in board units (1 unit = 1 cell).
function boardLines() {
  const { pos, boxOf, cageOf, cellAt } = shape;
  let boxPath = "", cagePath = "";
  const inset = 0.12;
  for (let i = 0; i < shape.size; i++) {
    const { r, c } = pos[i];
    const at = (dr, dc) => cellAt(r + dr, c + dc);
    const sameBox = j => j !== undefined && boxOf[j] === boxOf[i];
    if (!sameBox(at(-1, 0))) boxPath += `M${c} ${r}H${c + 1}`;
    if (!sameBox(at(0, -1))) boxPath += `M${c} ${r}V${r + 1}`;
    if (at(1, 0) === undefined) boxPath += `M${c} ${r + 1}H${c + 1}`;
    if (at(0, 1) === undefined) boxPath += `M${c + 1} ${r}V${r + 1}`;
    if (!cageOf[i]) continue;
    const same = j => j !== undefined && cageOf[j] === cageOf[i];
    const T = !same(at(-1, 0)), B = !same(at(1, 0)), L = !same(at(0, -1)), R = !same(at(0, 1));
    const x0 = c + inset, x1 = c + 1 - inset, y0 = r + inset, y1 = r + 1 - inset;
    if (T) cagePath += `M${L ? x0 : c} ${y0}H${R ? x1 : c + 1}`;
    if (B) cagePath += `M${L ? x0 : c} ${y1}H${R ? x1 : c + 1}`;
    if (L) cagePath += `M${x0} ${T ? y0 : r}V${B ? y1 : r + 1}`;
    if (R) cagePath += `M${x1} ${T ? y0 : r}V${B ? y1 : r + 1}`;
    // Inside corners, where the cage turns around a cell that isn't part of it.
    if (!T && !L && !same(at(-1, -1))) cagePath += `M${c} ${y0}H${x0}V${r}`;
    if (!T && !R && !same(at(-1, 1))) cagePath += `M${c + 1} ${y0}H${x1}V${r}`;
    if (!B && !L && !same(at(1, -1))) cagePath += `M${c} ${y1}H${x0}V${r + 1}`;
    if (!B && !R && !same(at(1, 1))) cagePath += `M${c + 1} ${y1}H${x1}V${r + 1}`;
  }
  return `<svg class="lines" viewBox="0 0 ${shape.cols} ${shape.rows}" preserveAspectRatio="none" aria-hidden="true">
    <path class="cage-line" d="${cagePath}"/><path class="box-line" d="${boxPath}"/></svg>`;
}

let cellEls = [], digitEls = [], noteEls = [];

function showGame() {
  screen = "game";
  hintView = null;
  closeSheet();
  let cells = "";
  for (let i = 0; i < shape.size; i++) {
    const { r, c } = shape.pos[i];
    const cg = shape.cageOf[i];
    const sum = cg && cg.cells[0] === i ? `<span class="cage-sum">${cg.sum}</span>` : "";
    cells += `<div class="cell${sum ? " has-sum" : ""}" data-i="${i}" style="grid-row:${r + 1};grid-column:${c + 1}" role="gridcell" aria-label="${shape.cellName(i)}">${sum}<span class="digit"></span><div class="notes">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<span>${n}</span>`).join("")}</div></div>`;
  }
  const zoomable = shape.samurai;
  app.innerHTML = `
    <div class="topbar">
      <button class="icon-btn" id="home" aria-label="Back to home">${ICONS.back}</button>
      <h1>${VARIANTS[variantOf(game)].title}</h1>
      <button class="icon-btn" id="open-settings" aria-label="Settings">${ICONS.gear}</button>
    </div>
    <div class="info" id="info"></div>
    <div class="board-wrap">
      <div class="board-scroll${zoomable ? " zoomable" : ""}" id="board-scroll">
        <div class="board" id="board" role="grid" aria-label="Sudoku board" style="--cols:${shape.cols};--rows:${shape.rows};${zoomable ? `width:${zoom * 100}%` : ""}">${cells}${boardLines()}</div>
      </div>
      <div class="pause-cover" id="pause-cover" hidden><button id="resume" aria-label="Resume">${ICONS.play}</button></div>
    </div>
    ${zoomable ? `<div class="zoom"><span>Drag to move around</span><button id="zoom-out" aria-label="Zoom out">${ICONS.minus}</button><button id="zoom-in" aria-label="Zoom in">${ICONS.plus}</button></div>` : ""}
    <div class="tools" id="tools"></div>
    <div class="pad" id="pad"></div>`;
  cellEls = new Array(shape.size); digitEls = new Array(shape.size); noteEls = new Array(shape.size);
  app.querySelectorAll(".cell").forEach(el => {
    const i = +el.dataset.i;
    cellEls[i] = el; digitEls[i] = el.querySelector(".digit"); noteEls[i] = el.querySelector(".notes").children;
  });
  // "click" rather than "pointerdown", so dragging to scroll a Samurai board doesn't select cells.
  document.getElementById("board").addEventListener("click", e => {
    const el = e.target.closest(".cell");
    if (!el || game.paused) return;
    selected = +el.dataset.i;
    renderBoard();
  });
  document.getElementById("home").onclick = () => { saveGame(); showHome(); };
  document.getElementById("open-settings").onclick = openSettings;
  document.getElementById("resume").onclick = () => togglePause(false);
  if (zoomable) {
    document.getElementById("zoom-in").onclick = () => setZoom(1);
    document.getElementById("zoom-out").onclick = () => setZoom(-1);
    updateZoomButtons();
  }
  renderInfo(); renderBoard(); renderTools(); renderPad();
  if (selected >= 0 && selected < shape.size) requestAnimationFrame(() => scrollToCells([selected], true));
  startTimer();
}

function setZoom(step) {
  const sc = document.getElementById("board-scroll"), board = document.getElementById("board");
  const k = Math.max(0, Math.min(ZOOMS.length - 1, ZOOMS.indexOf(zoom) + step));
  if (ZOOMS[k] === zoom) return;
  // Keep the middle of the view in the middle while zooming.
  const cx = (sc.scrollLeft + sc.clientWidth / 2) / sc.scrollWidth, cy = (sc.scrollTop + sc.clientHeight / 2) / sc.scrollHeight;
  zoom = ZOOMS[k];
  store.set("qs-zoom", zoom);
  board.style.width = zoom * 100 + "%";
  sc.scrollLeft = cx * sc.scrollWidth - sc.clientWidth / 2;
  sc.scrollTop = cy * sc.scrollHeight - sc.clientHeight / 2;
  updateZoomButtons();
}
function updateZoomButtons() {
  document.getElementById("zoom-out").disabled = zoom === ZOOMS[0];
  document.getElementById("zoom-in").disabled = zoom === ZOOMS[ZOOMS.length - 1];
}

// Samurai: scroll the zoomed board so these cells are in view.
function scrollToCells(list, instant) {
  const sc = document.getElementById("board-scroll");
  if (!sc || !shape || !shape.samurai || !list.length) return;
  const w = sc.scrollWidth / shape.cols, h = sc.scrollHeight / shape.rows;
  const rs = list.map(i => shape.pos[i].r), cs = list.map(i => shape.pos[i].c);
  const top = Math.min(...rs) * h, bottom = (Math.max(...rs) + 1) * h, left = Math.min(...cs) * w, right = (Math.max(...cs) + 1) * w;
  const visible = top >= sc.scrollTop && bottom <= sc.scrollTop + sc.clientHeight && left >= sc.scrollLeft && right <= sc.scrollLeft + sc.clientWidth;
  if (visible) return;
  sc.scrollTo({ left: (left + right - sc.clientWidth) / 2, top: (top + bottom - sc.clientHeight) / 2, behavior: instant ? "auto" : "smooth" });
}

function renderInfo() {
  const el = document.getElementById("info");
  if (!el) return;
  const limitText = settings.mistakeLimit ? `${game.mistakes}/${MAX_MISTAKES}` : `${game.mistakes}`;
  el.innerHTML = `
    <div><span class="label">${game.daily ? "Daily" : "Level"}</span><span class="value">${LEVELS[game.level].label}</span></div>
    <div><span class="label">Mistakes</span><span class="value ${game.mistakes ? "bad" : ""}">${limitText}</span></div>
    <div>${settings.showTimer ? `<span class="label">Time</span>` : `<span class="label">&nbsp;</span>`}
      <span class="timer">${settings.showTimer ? `<span class="value" id="time">${formatTime(game.elapsed)}</span>` : ""}
      ${game.finished ? "" : `<button class="pause-btn" id="pause" aria-label="${game.paused ? "Resume" : "Pause"}">${game.paused ? ICONS.play : ICONS.pause}</button>`}</span></div>`;
  const p = document.getElementById("pause");
  if (p) p.onclick = () => togglePause();
}

function renderBoard() {
  const board = document.getElementById("board");
  if (!board) return;
  board.classList.toggle("paused", game.paused);
  document.getElementById("pause-cover").hidden = !game.paused;
  const sel = selected;
  const selDigit = sel >= 0 ? game.values[sel] : 0;
  const peers = new Set(sel >= 0 ? shape.housePeers[sel] : []);
  // Cells whose digit clashes with a wrong entry get a red tint.
  const conflict = new Set();
  for (let i = 0; i < shape.size; i++) {
    const v = game.values[i];
    if (v && v !== game.solution[i]) for (const p of shape.peers[i]) if (game.values[p] === v) conflict.add(p);
  }
  for (let i = 0; i < shape.size; i++) {
    const el = cellEls[i];
    const v = game.values[i];
    const wrong = v && v !== game.solution[i];
    const same = settings.highlightSame && selDigit && v === selDigit && i !== sel;
    el.className = "cell" + (shape.cageOf[i] && shape.cageOf[i].cells[0] === i ? " has-sum" : "")
      + (isGiven(i) ? " given" : v ? " entered" : "") + (wrong ? " wrong" : "")
      + (peers.has(i) ? " peer" : "") + (same ? " same" : "") + (conflict.has(i) ? " conflict" : "") + (i === sel ? " selected" : "");
    el.style.animationDelay = "";
    digitEls[i].textContent = v || "";
    const notes = v ? 0 : game.notes[i];
    for (let d = 1; d <= 9; d++) {
      const on = (notes >> d) & 1;
      noteEls[i][d - 1].className = on ? (settings.highlightSame && selDigit === d ? "on match" : "on") : "";
    }
  }
  if (hintView) {
    const hl = hintView.pages[hintView.page].hl;
    const add = (list, cls) => (list || []).forEach(i => cellEls[i].classList.add(cls));
    for (const i of hl.area || []) cellEls[i].classList.remove("peer", "same", "selected");
    add(hl.area, "hint-area"); add(hl.cause, "hint-cause"); add(hl.elim, "hint-elim");
    if (hl.target !== undefined) cellEls[hl.target].classList.add("hint-target");
    // Show the pencil marks the explanation talks about, even if the player hasn't written them.
    const ghostCells = new Set((hl.ghost || []).map(g => g[0]));
    for (const i of ghostCells) for (const span of noteEls[i]) span.className = "";
    for (const [i, d, kind] of hl.ghost || []) {
      if (!game.values[i]) noteEls[i][d - 1].className = kind === "x" ? "ghost-x" : "ghost";
    }
  }
  if (popCell >= 0) { cellEls[popCell].classList.add("pop"); popCell = -1; }
  for (const [k, order] of flashCells) {
    const el = cellEls[k];
    el.style.animationDelay = order * 35 + "ms";
    el.classList.add("flash");
  }
  flashCells = [];
}

function renderTools() {
  const el = document.getElementById("tools");
  if (!el) return;
  if (hintView) return renderHintCard(el);

function renderHintCard(el) {
  const { pages, page } = hintView;
  const p = pages[page];
  const last = page === pages.length - 1;
  el.className = "";
  el.innerHTML = `<div class="hint-card" role="region" aria-live="polite" aria-label="Hint">
    <div class="hint-head"><span class="hint-kicker">${p.kicker}</span>
      <button class="hint-close" id="h-close" aria-label="Close hint">${ICONS.close}</button></div>
    <h4>${p.title}</h4>
    <p>${p.text}</p>
    ${!p.tip ? "" : page === 0 ? `<p class="tip">${p.tip}</p>`
      : `<details id="h-tip" ${hintTipOpen ? "open" : ""}><summary>How this technique works</summary><p>${p.tip}</p></details>`}
    <div class="hint-actions">
      ${page > 0 ? `<button id="h-back">Back</button>` : ""}
      ${p.stuck ? `<button class="primary" id="h-reveal">Reveal one cell</button>`
        : last ? `<button class="primary" id="h-done">Got it</button>`
        : `<button class="primary" id="h-next">${page === 0 ? "Explain the step" : "Next"}</button>`}
    </div></div>`;
  el.querySelector("#h-close").onclick = closeHint;
  el.querySelector("#h-tip")?.addEventListener("toggle", e => (hintTipOpen = e.target.open));
  el.querySelector("#h-back")?.addEventListener("click", () => showHintPage(page - 1));
  el.querySelector("#h-next")?.addEventListener("click", () => showHintPage(page + 1));
  el.querySelector("#h-done")?.addEventListener("click", closeHint);
  el.querySelector("#h-reveal")?.addEventListener("click", () => { hintView = null; renderTools(); revealCell(); });
}

function renderPad() {
  const el = document.getElementById("pad");
  if (!el) return;
  el.classList.toggle("notes-mode", notesMode);
  const total = new Array(10).fill(0), placed = new Array(10).fill(0);
  for (let i = 0; i < shape.size; i++) {
    total[game.solution[i]]++;
    if (game.values[i] === game.solution[i]) placed[game.solution[i]]++;
  }
  let html = "";
  for (let d = 1; d <= 9; d++) {
    const left = total[d] - placed[d];
    html += `<button class="num ${left ? "" : "used-up"}" data-d="${d}" aria-label="${d}, ${left} left"><span class="n">${d}</span><span class="left">${left}</span></button>`;
  }
  el.innerHTML = html;
  el.querySelectorAll(".num").forEach(b => (b.onclick = () => enterDigit(+b.dataset.d)));
}

/* ---------- 5. Pop-up sheets ---------- */
function openSheet(html, onReady, dismissable = true) {
  layer.innerHTML = `<div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  const overlay = document.getElementById("overlay");
  if (dismissable) overlay.addEventListener("click", e => { if (e.target === overlay) closeSheet(); });
  overlay.dataset.dismissable = dismissable ? "1" : "";
  if (onReady) onReady(overlay);
}
function closeSheet() { layer.innerHTML = ""; }

function confirmReplace(start) {
  if (!(game && !game.finished && !game.lost)) return start();
  openSheet(`<h3>Start a new game?</h3>
    <p>Your current ${gameLabel(game)} game (${formatTime(game.elapsed)}) will be lost.</p>
    <button class="btn primary" id="yes">Start new game</button>
    <button class="btn" id="no">Keep playing</button>`, o => {
      o.querySelector("#yes").onclick = () => { closeSheet(); start(); };
      o.querySelector("#no").onclick = () => { closeSheet(); if (screen === "home") { game.paused = false; showGame(); } };
    });
}

const variantTabs = (current, attr) => `<div class="tabs three" role="tablist">${Object.entries(VARIANTS).map(([k, v]) =>
  `<button role="tab" aria-selected="${k === current}" data-${attr}="${k}" class="${k === current ? "on" : ""}">${v.label}</button>`).join("")}</div>`;

function openNewGame(variant = lastVariant) {
  lastVariant = variant;
  store.set("qs-variant", variant);
  openSheet(`<h3>New game</h3>
    ${variantTabs(variant, "variant")}
    <p class="mode-blurb">${VARIANTS[variant].blurb}.</p>
    <div class="choice-list">${Object.entries(LEVELS).map(([key, l]) =>
      `<button class="btn" data-level="${key}"><span>${l.label}</span><span class="hint-text">${l.blurb}</span></button>`).join("")}</div>`,
    o => {
      o.querySelectorAll("[data-variant]").forEach(b => (b.onclick = () => openNewGame(b.dataset.variant)));
      o.querySelectorAll("[data-level]").forEach(b => (b.onclick = () => {
        closeSheet();
        confirmReplace(() => newGame(variant, b.dataset.level, null));
      }));
    });
}

function openWin(newBest) {
  const s = levelStats(variantOf(game), game.level);
  openSheet(`<span class="win-mark">Solved</span>
    <h3>${game.mistakes === 0 ? "Flawless." : "Nicely done."}</h3>
    <div class="result-grid">
      <div><b>${formatTime(game.elapsed)}</b><span>Time</span></div>
      <div><b>${formatTime(s.best)}</b><span>${newBest ? "New best" : "Best"}</span></div>
      <div><b>${game.mistakes}</b><span>Mistakes</span></div>
    </div>
    <p>${gameLabel(game)}${game.daily ? " daily puzzle" : ""} · ${game.hintsUsed ? `${game.hintsUsed} hint${game.hintsUsed > 1 ? "s" : ""} used` : "no hints"} · ${s.won} solved at this level</p>
    <button class="btn primary" id="again">New game</button>
    <button class="btn" id="go-home">Home</button>`, o => {
      o.querySelector("#again").onclick = () => openNewGame(variantOf(game));
      o.querySelector("#go-home").onclick = () => { closeSheet(); showHome(); };
    }, false);
}

function openGameOver() {
  openSheet(`<h3>That's ${MAX_MISTAKES} mistakes</h3>
    <p>You can keep going with one more chance. No video to watch.</p>
    <button class="btn primary" id="second">Second chance</button>
    <button class="btn" id="again">New game</button>
    <button class="btn" id="go-home">Home</button>`, o => {
      o.querySelector("#second").onclick = () => {
        game.mistakes = MAX_MISTAKES - 1;
        game.lost = false;
        closeSheet(); afterMove();
      };
      o.querySelector("#again").onclick = () => { game.lost = true; game.finished = true; saveGame(); openNewGame(variantOf(game)); };
      o.querySelector("#go-home").onclick = () => { game.finished = true; saveGame(); closeSheet(); showHome(); };
    }, false);
}

function openStats(variant, level) {
  variant = variant || store.get("qs-stats-variant", "classic");
  level = level || store.get("qs-stats-tab", "easy");
  store.set("qs-stats-variant", variant);
  store.set("qs-stats-tab", level);
  const s = levelStats(variant, level);
  const rate = s.played ? Math.round((s.won / s.played) * 100) + "%" : "–";
  const avg = s.won ? formatTime(Math.round(s.totalTime / s.won)) : "–";
  openSheet(`<h3>Statistics</h3>
    ${variantTabs(variant, "svariant")}
    <div class="tabs">${Object.entries(LEVELS).map(([k, l]) => `<button data-tab="${k}" class="${k === level ? "on" : ""}">${l.label}</button>`).join("")}</div>
    <div class="stat-list">
      <div class="stat-row"><span>Games started</span><b>${s.played}</b></div>
      <div class="stat-row"><span>Games solved</span><b>${s.won}</b></div>
      <div class="stat-row"><span>Win rate</span><b>${rate}</b></div>
      <div class="stat-row"><span>Solved with no mistakes</span><b>${s.noMistakeWins}</b></div>
      <div class="stat-row"><span>Best time</span><b>${s.best != null ? formatTime(s.best) : "–"}</b></div>
      <div class="stat-row"><span>Average time</span><b>${avg}</b></div>
    </div>
    <button class="btn" id="close">Close</button>`, o => {
      o.querySelectorAll("[data-svariant]").forEach(b => (b.onclick = () => openStats(b.dataset.svariant, level)));
      o.querySelectorAll("[data-tab]").forEach(b => (b.onclick = () => openStats(variant, b.dataset.tab)));
      o.querySelector("#close").onclick = closeSheet;
    });
}

function openSettings() {
  const rows = [
    ["mistakeLimit", "Mistake limit", `The game stops after ${MAX_MISTAKES} wrong numbers`],
    ["highlightSame", "Highlight matching numbers", "Shade every cell with the selected number"],
    ["autoRemoveNotes", "Clear notes automatically", "Placing a number removes it from nearby notes"],
    ["showTimer", "Show timer", "Time still counts toward your stats"],
  ];
  openSheet(`<h3>Settings</h3>
    <div>${rows.map(([key, title, help]) => `
      <label class="setting" for="set-${key}"><span class="txt">${title}<small>${help}</small></span>
        <span class="switch"><input type="checkbox" id="set-${key}" data-key="${key}" ${settings[key] ? "checked" : ""}><span class="track"></span></span></label>`).join("")}
    </div>
    <button class="btn" id="close">Done</button>`, o => {
      o.querySelectorAll("input[data-key]").forEach(input => (input.onchange = () => {
        settings[input.dataset.key] = input.checked;
        store.set("qs-settings", settings);
        if (screen === "game") { renderInfo(); renderBoard(); }
      }));
      o.querySelector("#close").onclick = closeSheet;
    });
}

let toastTimer = null;
function toast(message) {
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast";
  t.setAttribute("role", "status");
  t.textContent = message;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2200);
}

/* ---------- 6. Keyboard + startup ---------- */
document.addEventListener("keydown", e => {
  if (layer.childElementCount) {
    if (e.key === "Escape" && document.getElementById("overlay")?.dataset.dismissable) closeSheet();
    return;
  }
  if (screen !== "game" || !game) return;
  const k = e.key;
  if (k >= "1" && k <= "9") { enterDigit(+k); return; }
  if (k === "Backspace" || k === "Delete" || k === "0") { erase(); e.preventDefault(); return; }
  if (k === "n" || k === "N") { toggleNotes(); return; }
  if (k === "z" || k === "Z") { undo(); e.preventDefault(); return; }
  if (k === "h" || k === "H") { hintView ? closeHint() : openHint(); return; }
  if (k === "Escape" && hintView) { closeHint(); return; }
  if (k === " " || k === "p" || k === "P") { togglePause(); e.preventDefault(); return; }
  const moves = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
  if (moves[k] && !game.paused) {
    e.preventDefault();
    if (selected < 0) selected = 0;
    else {
      // Step in that direction, wrapping around and skipping the gaps in a Samurai board.
      const [dr, dc] = moves[k];
      let { r, c } = shape.pos[selected];
      for (let n = 0; n < Math.max(shape.rows, shape.cols); n++) {
        r = (r + dr + shape.rows) % shape.rows; c = (c + dc + shape.cols) % shape.cols;
        const j = shape.cellAt(r, c);
        if (j !== undefined) { selected = j; break; }
      }
    }
    renderBoard();
    scrollToCells([selected]);
  }
});

// Pause automatically when you leave the app, so the clock is fair.
document.addEventListener("visibilitychange", () => {
  if (document.hidden && screen === "game" && game && !game.finished) { game.paused = true; saveGame(); renderInfo(); renderBoard(); }
});

// Android back button (used by the Android app): close what's open, or step back to home.
// Returns true when it handled the press, false to let the app close.
window.androidBack = function () {
  if (layer.childElementCount) {
    if (document.getElementById("overlay")?.dataset.dismissable) closeSheet();
    return true;   // the win / out-of-mistakes screens need a button choice
  }
  if (screen === "game") {
    if (hintView) { closeHint(); return true; }
    if (game) saveGame();
    showHome();
    return true;
  }
  location.href = "index.html";   // from Sudoku's home screen, back goes to all games
  return true;
};

// Called by the Android app when it goes to the background: pause the clock and save.
window.androidPause = function () {
  if (screen === "game" && game && !game.finished && !game.lost) {
    game.paused = true;
    saveGame();
    renderInfo(); renderBoard();
  }
};

// A game stuck on the "out of mistakes" screen or already finished can't be continued.
if (game && (game.finished || game.lost)) { useGame(null); store.remove("qs-game"); }
showHome();
</script>
